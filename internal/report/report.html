<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - manifest diff</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --panel-2: #f0eee9; --line: #dcd9d1; --line-soft: #ebe8e1;
  --ink: #1b1a17; --ink-2: #55524b; --ink-3: #8c887e; --invert: #1b1a17; --invert-ink: #ffffff;
  --add: #18794e; --add-bg: #e7f5ec; --add-hl: #aee3c0;
  --del: #c2291f; --del-bg: #fdecea; --del-hl: #f6b8b2;
  --mod: #96690a; --mod-bg: #fbf2d8;
  --ring: rgba(27,26,23,.35);
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --bar-h: 52px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #101010; --panel: #1c1c1a; --panel-2: #282825; --line: #4a4943; --line-soft: #33322e;
  --ink: #f4f2ec; --ink-2: #cfccc2; --ink-3: #a09c91; --invert: #f4f2ec; --invert-ink: #101010;
  --add: #6be39a; --add-bg: #143a25; --add-hl: #23703f;
  --del: #ff9489; --del-bg: #4a1c1b; --del-hl: #93322e;
  --mod: #f0c458; --mod-bg: #40330f;
  --ring: rgba(244,242,236,.5);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101010; --panel: #1c1c1a; --panel-2: #282825; --line: #4a4943; --line-soft: #33322e;
  --ink: #f4f2ec; --ink-2: #cfccc2; --ink-3: #a09c91; --invert: #f4f2ec; --invert-ink: #101010;
  --add: #6be39a; --add-bg: #143a25; --add-hl: #23703f;
  --del: #ff9489; --del-bg: #4a1c1b; --del-hl: #93322e;
  --mod: #f0c458; --mod-bg: #40330f;
  --ring: rgba(244,242,236,.5);
  color-scheme: dark;
}}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.hide { display: none !important; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.add { color: var(--add); } .del { color: var(--del); } .mod { color: var(--mod); }
.stat { font-family: var(--mono); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; }
.muted { color: var(--ink-3); }

/* Buttons and inputs share one height and one border. */
.btn { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.btn:hover { color: var(--ink); border-color: var(--ink-3); }
.btn.on { background: var(--invert); border-color: var(--invert); color: var(--invert-ink); }
.btn:disabled { opacity: .4; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 2px; gap: 2px; }
.seg button { height: 22px; padding: 0 9px; border-radius: 4px; color: var(--ink-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--invert); color: var(--invert-ink); }
.badge { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; font: 700 11px/1 var(--mono); flex: none; }
.badge.added { color: var(--add); background: var(--add-bg); } .badge.modified { color: var(--mod); background: var(--mod-bg); } .badge.deleted { color: var(--del); background: var(--del-bg); }
.chev { display: inline-block; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(45deg); margin: 0 3px 3px; flex: none; }
.closed > .group-h .chev, .collapsed > .file-h .chev { transform: rotate(-45deg); margin-bottom: 0; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--ink-2); background: var(--panel); }

/* Top bar: one row that stays put. */
.bar { position: sticky; top: 0; z-index: 30; min-height: var(--bar-h); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.mark { width: 26px; height: 26px; border-radius: 7px; background: var(--invert); color: var(--invert-ink); display: grid; place-items: center; font: 700 15px/1 var(--mono); flex: none; }
.bar h1 { margin: 0; font-size: 15px; font-weight: 650; white-space: nowrap; }
.bar h1 a { text-decoration: none; }
.bar h1 a:hover { text-decoration: underline; }
.bar .pr { color: var(--ink-2); flex: 1 1 120px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ref { font: 12px var(--mono); padding: 2px 7px; border-radius: 5px; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.refs { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); }

.shell { display: grid; grid-template-columns: 308px minmax(0, 1fr); align-items: start; }

/* Sidebar: everything for finding a file. */
.side { position: sticky; top: var(--bar-h); height: calc(100vh - var(--bar-h)); overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); font-size: 13px; }
.find { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 12px 12px 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.search { position: relative; }
.search input { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 0 30px 0 10px; }
.search input::placeholder { color: var(--ink-3); }
.search kbd { position: absolute; right: 7px; top: 6px; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink-2); font-size: 12.5px; }
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip.on { border-color: var(--invert); box-shadow: inset 0 0 0 1px var(--invert); color: var(--ink); }
.chip b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
.facets { display: flex; flex-wrap: wrap; gap: 6px; }
.facets select { flex: 1 1 120px; min-width: 0; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 0 6px; font-size: 12.5px; color: var(--ink-2); }
.facets select.on { border-color: var(--invert); color: var(--ink); }
.count { display: flex; align-items: center; justify-content: space-between; min-height: 20px; color: var(--ink-3); font-size: 12px; }
.count button { color: var(--ink-2); text-decoration: underline; font-size: 12px; }
.group { border-bottom: 1px solid var(--line-soft); }
.group-h { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; text-align: left; }
.group-h:hover { background: var(--panel-2); }
.group-h .names { flex: 1; min-width: 0; display: grid; }
.group-h .app { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-h .where { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.closed .items { display: none; }
.items { padding: 0 6px 6px; }
.item { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 20px; border-radius: 5px; text-decoration: none; }
.item:hover { background: var(--panel-2); }
.item.active { background: var(--invert); color: var(--invert-ink); }
.item.active .rn, .item.active .stat span { color: inherit; opacity: .75; }
.item .rk { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .rn { flex: 1; min-width: 0; font: 12px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .stat { font-size: 11px; }

.main { min-width: 0; padding: 22px 28px 48px; max-width: 1640px; }

/* Overview: what the change touches, before any diff. */
.overview { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 26px; display: grid; gap: 16px; }
.lede { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; color: var(--ink-2); font-size: 13px; }
.tally { display: grid; gap: 8px; }
.meter { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel-2); gap: 2px; }
.meter i { display: block; min-width: 3px; }
.meter .a { background: var(--add); } .meter .m { background: var(--mod); } .meter .d { background: var(--del); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.legend .lines { margin-left: auto; }
.sub { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.apps { max-height: 290px; overflow: auto; border: 1px solid var(--line-soft); border-radius: 8px; }
.apps table { width: 100%; border-collapse: collapse; font-size: 13px; }
.apps th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 7px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.apps td { padding: 6px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.apps tr:last-child td { border-bottom: 0; }
.apps tbody tr { cursor: pointer; }
.apps tbody tr:hover { background: var(--panel-2); }
.apps tbody tr.on { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--invert); }
.apps .an { font-weight: 600; }
.apps .qty { text-align: right; width: 1%; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.apps .zero { color: var(--line); }
.apps .spark { width: 120px; }
.spark i { display: block; height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--add) var(--p), var(--del) 0); }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.kinds .chip { padding-left: 9px; }
.repeat-note { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); color: var(--ink-2); font-size: 13px; }
.repeat-note b { color: var(--ink); }
.repeat-note .btn { margin-left: auto; }

/* One section per application, one card per manifest. */
.app-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 26px 2px 10px; }
.app-h h2 { margin: 0; font-size: 16px; font-weight: 650; }
.app-h .where { color: var(--ink-3); font-size: 13px; }
.app-h .stat { margin-left: auto; }
.listbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.listbar .sub { margin: 0 auto 0 2px; }
.file { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; scroll-margin-top: calc(var(--bar-h) + 10px); overflow: clip; }
.file.active { border-color: var(--ink-3); }
.file-h { position: sticky; top: var(--bar-h); z-index: 5; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.collapsed > .file-h { border-bottom: 0; }
.collapsed > .file-b { display: none; }
.file-h .title { flex: 1; min-width: 0; display: grid; gap: 1px; }
.file-h .what { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.file-h .kind { font-weight: 650; white-space: nowrap; }
.file-h .name { font: 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-h .ns { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }
.file-h .path { font: 11.5px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-h .actions { display: flex; align-items: center; gap: 10px; flex: none; }
.file-h .btn { height: 24px; padding: 0 8px; font-size: 12px; }
.same { height: 22px; padding: 0 8px; border-radius: 11px; background: var(--panel-2); color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.same:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-3); }
.ratio { width: 44px; height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--add) var(--p), var(--del) 0); flex: none; }

.file-b { font: 12.5px/20px var(--mono); overflow-x: auto; color: var(--ink-2); }
.file-b.wrap .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.placeholder { padding: 20px; color: var(--ink-3); text-align: center; font-family: var(--sans); }
.row { display: grid; grid-template-columns: 46px 46px 20px minmax(0, 1fr); box-shadow: inset 3px 0 0 transparent; }
.row.add { background: var(--add-bg); box-shadow: inset 3px 0 0 var(--add); }
.row.del { background: var(--del-bg); box-shadow: inset 3px 0 0 var(--del); }
.ln { text-align: right; padding-right: 8px; color: var(--ink-3); user-select: none; font-size: 11px; font-variant-numeric: tabular-nums; }
.sign { text-align: center; user-select: none; font-weight: 700; }
.row.add .sign, .srow .add .ln { color: var(--add); } .row.del .sign, .srow .del .ln { color: var(--del); }
.txt { font: inherit; white-space: pre; padding: 0 14px 0 4px; tab-size: 2; }
.row.add .txt, .row.del .txt, .srow .add .txt, .srow .del .txt { color: var(--ink); }
mark { background: var(--del-hl); color: inherit; border-radius: 3px; }
.row.add mark, .srow .add mark { background: var(--add-hl); }
.k { color: var(--ink); } .c { color: var(--ink-3); font-style: italic; }
.gap { display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 26px; background: var(--panel-2); color: var(--ink-3); font: 12px var(--sans); border-block: 1px solid var(--line-soft); }
.gap:first-child { border-top: 0; } .gap:last-child { border-bottom: 0; }
.gap button { color: var(--ink-2); font-weight: 500; }
.gap button:hover { color: var(--ink); text-decoration: underline; }
.gap .at { margin-left: auto; font: 11px var(--mono); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.side-l, .side-r { display: grid; grid-template-columns: 46px minmax(0, 1fr); min-width: 0; }
.side-r { border-left: 1px solid var(--line-soft); }
.srow .add { background: var(--add-bg); } .srow .del { background: var(--del-bg); }
.srow .blank { background: var(--panel-2); }
.more { font-family: var(--sans); padding: 8px 12px; border-top: 1px solid var(--line-soft); }
.empty { padding: 72px 24px; text-align: center; color: var(--ink-2); }
.empty h2 { margin: 0 0 6px; color: var(--ink); }
.none { padding: 40px 24px; text-align: center; color: var(--ink-3); }
.footer { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-3); font-size: 12px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .main { padding: 16px; }
  .bar { padding: 8px 16px; }
  .apps .opt, .file-h .path, .ratio, .legend .lines { display: none; }
  .lede { font-size: 19px; }
}
@media print {
  .bar, .file-h { position: static; }
  .side, .tools, .listbar, .repeat-note .btn { display: none; }
  .shell { display: block; }
}
</style>
</head>
<body>
<script type="application/json" id="diff-data">{{.Data}}</script>
<noscript><p style="padding:20px">This report needs JavaScript to render.</p></noscript>
<header class="bar" id="bar"></header>
<div class="shell" id="shell"></div>
<script>
(function () {
'use strict';
const DATA = JSON.parse(document.getElementById('diff-data').textContent);
const meta = DATA.meta, R = DATA.result, files = R.files || [];
const state = { view: 'unified', context: 'compact', wrap: false, folded: false, q: '', status: new Set(), app: '', project: '', cluster: '', kind: '', same: '', active: -1 };
const LIMIT = 300;
const LETTER = {added: 'A', modified: 'M', deleted: 'D'};
const $ = (id) => document.getElementById(id);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  append(el, kids);
  return el;
}
function append(el, kid) {
  if (kid === null || kid === undefined || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach((k) => append(el, k)); return; }
  el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
function stat(add, del) {
  return h('span', {class: 'stat'}, add ? h('span', {class: 'add'}, '+' + add) : null, del ? h('span', {class: 'del'}, '−' + del) : null);
}
function share(add, del) { return '--p:' + (add + del ? Math.round(100 * add / (add + del)) : 0) + '%'; }
function res(f) { return f.resource || {}; }
function appOf(f) { return res(f).app || f.path.split('/')[0]; }
function nameOf(f) { return res(f).name || f.path.split('/').pop().replace(/\.ya?ml$/, ''); }
function where(g) { return [g.project, g.cluster].filter(Boolean).join(' · '); }
function distinct(pick) { return new Set(files.map(pick).filter(Boolean)); }

/* Applications, in file order, and the files that carry the same change. */
const groups = [];
const sameAs = new Map();
(function () {
  const byKey = new Map(), bySignature = new Map();
  files.forEach((f, i) => {
    const r = res(f), key = [appOf(f), r.project, r.cluster].join('|');
    if (!byKey.has(key)) {
      const g = {app: appOf(f), project: r.project || '', cluster: r.cluster || '', idx: [], add: 0, del: 0, added: 0, modified: 0, deleted: 0};
      byKey.set(key, g); groups.push(g);
    }
    const g = byKey.get(key);
    g.idx.push(i); g.add += f.additions; g.del += f.deletions; g[f.status]++;
    f.group = g;

    const changed = [];
    (f.hunks || []).forEach((hk) => hk.lines.forEach((l) => { if (l.t !== 'ctx') changed.push(l.t + l.x); }));
    const signature = [f.status, r.kind, r.name, changed.join('\n')].join('\n');
    if (!bySignature.has(signature)) bySignature.set(signature, []);
    bySignature.get(signature).push(i);
  });
  let n = 0;
  bySignature.forEach((idx) => {
    if (idx.length < 2) return;
    const id = 's' + n++;
    idx.forEach((i) => { files[i].same = id; });
    sameAs.set(id, idx);
  });
})();
const repeats = Array.from(sameAs.values()).reduce((sum, idx) => sum + idx.length - 1, 0);

/* YAML tint on an escaped line: keys darker than values, comments lighter. */
function tint(text) {
  const e = esc(text);
  const m = e.match(/^(\s*(?:- )?)([^#:]+?)(:)(\s|$)(.*)$/);
  if (m && !/^(&quot;|&#39;)/.test(m[2])) return m[1] + '<span class="k">' + m[2] + '</span>' + m[3] + m[4] + tintValue(m[5]);
  return tintValue(e);
}
function tintValue(v) {
  if (v.charAt(0) === '#') return '<span class="c">' + v + '</span>';
  const at = v.indexOf(' #');
  return at < 0 ? v : v.slice(0, at) + '<span class="c">' + v.slice(at) + '</span>';
}
function lineHTML(l) {
  if (l.hl && (l.hl[0] || l.hl[1])) {
    /* hl counts code points, so slice an array of them, not UTF-16 units. */
    const cp = Array.from(l.x);
    return esc(cp.slice(0, l.hl[0]).join('')) + '<mark>' + esc(cp.slice(l.hl[0], l.hl[1]).join('')) + '</mark>' + esc(cp.slice(l.hl[1]).join(''));
  }
  return tint(l.x);
}

/* top bar */
function segment(key, options) {
  return h('div', {class: 'seg', role: 'group'}, options.map(([value, label]) =>
    h('button', {class: state[key] === value ? 'on' : '', 'data-seg': key, 'data-value': value, onclick: () => setMode(key, value)}, label)));
}
function buildBar() {
  const title = h('h1', {}, meta.prUrl ? h('a', {href: meta.prUrl, target: '_blank', rel: 'noopener'}, meta.title) : meta.title);
  const refs = (meta.baseRef || meta.headRef) ? h('span', {class: 'refs'}, h('span', {class: 'ref'}, meta.baseRef || 'base'), '→', h('span', {class: 'ref'}, meta.headRef || 'head')) : null;
  const wrap = h('button', {class: 'btn', title: 'Wrap long lines', onclick: (e) => {
    state.wrap = !state.wrap; e.currentTarget.classList.toggle('on', state.wrap);
