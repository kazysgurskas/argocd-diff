version: 2

project_name: argocd-diff

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X github.com/kazysgurskas/argocd-diff/internal/version.Version={{.Env.VERSION}}
      - -X github.com/kazysgurskas/argocd-diff/internal/version.GitCommit={{.Env.GIT_COMMIT}}
      - -X github.com/kazysgurskas/argocd-diff/internal/version.BuildDate={{.Env.BUILD_DATE}}
    main: ./cmd/argocd-diff/main.go

dockers:
  - id: argocd-diff-amd64
    use: buildx
    extra_files:
      - "./"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
    goarch: amd64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/argocd-diff:{{ .Env.VERSION }}-amd64"
    dockerfile: Dockerfile
  - id: argocd-diff-arm64
    use: buildx
    extra_files:
      - "./"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
    goarch: arm64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/argocd-diff:{{ .Env.VERSION }}-arm64"
    dockerfile: Dockerfile

docker_manifests:
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/argocd-diff:{{ .Env.VERSION }}"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/argocd-diff:{{ .Env.VERSION }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/argocd-diff:{{ .Env.VERSION }}-arm64"
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/argocd-diff:latest"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/argocd-diff:{{ .Env.VERSION }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/argocd-diff:{{ .Env.VERSION }}-arm64"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
